<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>apykart – Earn Via Shop & Create</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Plus+Jakarta+Sans:wght@500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

<!-- ========== SPLASH SCREEN ========== -->
<div id="loadingScreen">
    <div class="splash-logo-wrap">
        <div class="splash-wordmark"><span class="ap">AP</span><span class="ykart">YKART</span></div>
        <div class="splash-tag">Earn While You Shop</div>
    </div>
    <div class="splash-loader">
        <div class="splash-loading-text">Loading…</div>
        <div class="splash-dots">
            <div class="splash-dot"></div>
            <div class="splash-dot"></div>
            <div class="splash-dot"></div>
        </div>
    </div>
</div>

<!-- ========== APP ========== -->
<div id="app" style="display:none">
    <!-- All app content here -->
    <div id="appContent">
        <!-- Copy all app content from previous code -->
    </div>
</div>

<!-- ========== SCRIPTS ========== -->
<script>
// ✅ FIX: Load main.js properly
document.addEventListener('DOMContentLoaded', function() {
    console.log('🔄 DOM loaded, loading main.js...');
    
    // Check if main.js is loaded
    const script = document.createElement('script');
    script.type = 'module';
    script.src = 'js/main.js';
    script.onload = function() {
        console.log('✅ main.js loaded successfully');
    };
    script.onerror = function() {
        console.error('❌ Failed to load main.js');
        // Fallback: hide loading screen anyway
        setTimeout(function() {
            document.getElementById('loadingScreen').classList.add('hidden');
            document.getElementById('app').style.display = 'flex';
        }, 3000);
    };
    document.head.appendChild(script);
    
    // ✅ FIX: Fallback timer - agar 5 sec mein load nahi hua toh loading screen hata do
    setTimeout(function() {
        const ls = document.getElementById('loadingScreen');
        if (ls && !ls.classList.contains('hidden')) {
            console.warn('⚠️ Loading timeout - forcing hide');
            ls.classList.add('hidden');
            document.getElementById('app').style.display = 'flex';
        }
    }, 5000);
});
</script>

</body>
</html>
