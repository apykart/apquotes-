<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1">
<title>Apykart Seller Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700;800&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  /* ---- Color system ----
     Ink      : deep indigo-navy — trust, authority, "after-hours founder desk"
     Indigo   : primary action color — calm confidence, not another generic blue
     Marigold : the one warm accent — Indian retail energy, used ONLY for money/CTA highlights
     Emerald  : growth / earnings — every rupee the seller makes is green, deliberately
     Coral    : reserved strictly for destructive / urgent states
  */
  --ink:#14123B; --ink-2:#1D1A52;
  --indigo:#4338CA; --indigo-dark:#332C9E; --indigo-light:#EEF0FE;
  --marigold:#F5A623; --marigold-dark:#DA8A0A; --marigold-light:#FFF4E0;
  --emerald:#0FA36D; --emerald-light:#E3F8EF;
  --coral:#E5484D; --coral-light:#FDEBEC;
  --cloud:#F5F6FB; --card:#FFFFFF;
  --border:#E8E8F3; --text:#161433; --muted:#6E6B8A; --muted-2:#A3A0BF;
  --radius:16px; --radius-sm:11px; --radius-lg:22px;
  --font-d:'Sora',system-ui,sans-serif; --font-b:'Inter',system-ui,sans-serif;
  --header-h:0px; --bottomnav-h:64px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;min-height:100dvh;background:var(--cloud);color:var(--text);font-family:var(--font-b);-webkit-font-smoothing:antialiased;overflow-x:hidden}
button{font-family:inherit;cursor:pointer;border:none;background:none}
a{text-decoration:none;color:inherit}
svg{display:block;flex-shrink:0}
::-webkit-scrollbar{width:0;height:0}

#app{max-width:480px;margin:0 auto;min-height:100dvh;display:flex;flex-direction:column;background:var(--cloud);position:relative}

/* ============ ACCESS GATE ============ */
#gate{position:fixed;inset:0;background:var(--ink);z-index:999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;color:#fff;text-align:center;padding:24px}
#gate .mark{width:56px;height:56px;border-radius:16px;background:linear-gradient(135deg,var(--marigold),var(--indigo));display:flex;align-items:center;justify-content:center}
#gate h1{font-family:var(--font-d);font-size:18px;font-weight:700;margin:6px 0 0}
#gate p{font-size:13px;color:rgba(255,255,255,.6);max-width:280px;line-height:1.6;margin:0}
#gate button{margin-top:10px;background:var(--marigold);color:#221200;font-weight:700;font-size:13px;padding:12px 22px;border-radius:99px}
#gate .spin{width:26px;height:26px;border:3px solid rgba(255,255,255,.2);border-top-color:var(--marigold);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* ============ HEADER (greeting) ============ */
.hero{background:linear-gradient(160deg,var(--ink) 0%,var(--ink-2) 60%,#2A2470 100%);padding:18px 18px 46px;position:relative;overflow:hidden;flex-shrink:0}
.hero::before{content:'';position:absolute;top:-40px;right:-30px;width:160px;height:160px;background:rgba(245,166,35,.10);border-radius:50%}
.hero-top{display:flex;align-items:center;justify-content:space-between;gap:10px;position:relative;z-index:1}
.hero-back{width:34px;height:34px;border-radius:10px;background:rgba(255,255,255,.08);display:flex;align-items:center;justify-content:center;color:#fff}
.hero-bell{width:34px;height:34px;border-radius:10px;background:rgba(255,255,255,.08);display:flex;align-items:center;justify-content:center;color:#fff;position:relative}
.hero-bell .dot{position:absolute;top:6px;right:7px;width:6px;height:6px;background:var(--marigold);border-radius:50%}
.hero-greet{display:flex;align-items:center;gap:10px;margin-top:16px;position:relative;z-index:1}
.hero-greet .gicon{width:38px;height:38px;border-radius:12px;background:rgba(245,166,35,.16);display:flex;align-items:center;justify-content:center;color:var(--marigold);flex-shrink:0}
.hero-greet-text .g-line{font-size:12.5px;color:rgba(255,255,255,.6);font-weight:600}
.hero-greet-text .g-name{font-family:var(--font-d);font-size:19px;font-weight:700;color:#fff;margin-top:1px}
.hero-status{display:inline-flex;align-items:center;gap:5px;font-size:10.5px;font-weight:700;padding:4px 10px 4px 8px;border-radius:99px;margin-top:12px;position:relative;z-index:1}
.hero-status.live{background:rgba(15,163,109,.18);color:#5FE6B5}
.hero-status.pending{background:rgba(245,166,35,.18);color:var(--marigold)}
.hero-status .pulse{width:6px;height:6px;border-radius:50%;background:currentColor;animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
.crumb-trail{display:flex;align-items:center;gap:5px;margin-top:10px;font-size:10.5px;color:rgba(255,255,255,.4);font-weight:600;position:relative;z-index:1}
.crumb-trail b{color:rgba(255,255,255,.75)}

.hero-card{background:var(--card);border-radius:var(--radius-lg);margin:-30px 14px 0;padding:16px;position:relative;z-index:2;box-shadow:0 14px 30px -12px rgba(20,18,59,.25)}
.hero-card-top{display:flex;justify-content:space-between;align-items:flex-start}
.hero-card-lbl{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.4px}
.hero-card-amt{font-family:var(--font-d);font-size:27px;font-weight:700;color:var(--text);margin-top:3px}
.hero-card-amt span{color:var(--emerald)}
.hero-chip{font-size:10.5px;font-weight:800;background:var(--emerald-light);color:var(--emerald);padding:4px 9px;border-radius:99px}
.hero-mini-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
.hero-mini{text-align:center;padding:9px 4px;border-radius:12px;background:var(--cloud)}
.hero-mini b{display:block;font-size:14.5px;font-weight:800;color:var(--text)}
.hero-mini span{font-size:9.5px;color:var(--muted);font-weight:600}

/* ============ CONTENT ============ */
.content{padding:16px 14px calc(20px + var(--bottomnav-h));flex:1}
.screen{display:none;animation:fadein .18s ease}
.screen.active{display:block}
@keyframes fadein{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}

.screen-header{display:flex;align-items:center;gap:11px;margin-bottom:14px}
.back-btn{width:34px;height:34px;border-radius:10px;background:var(--card);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;color:var(--text);flex-shrink:0}
.screen-header h2{font-family:var(--font-d);font-size:16.5px;font-weight:700;margin:0}
.screen-header .id-tag{font-size:11px;color:var(--muted);margin-top:1px;font-weight:600}

.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.grid-4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}

.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:14px}
.stat-card{display:flex;flex-direction:column;gap:5px}
.stat-card .ic{width:32px;height:32px;border-radius:10px;display:flex;align-items:center;justify-content:center;margin-bottom:2px}
.stat-card .num{font-family:var(--font-d);font-size:19px;font-weight:700}
.stat-card .lbl{font-size:11px;color:var(--muted);font-weight:600}

.qa-tile{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:13px 8px;text-align:center}
.qa-tile .ic{width:34px;height:34px;border-radius:11px;display:flex;align-items:center;justify-content:center;margin:0 auto 7px}
.qa-tile b{display:block;font-size:11.5px;font-weight:700}
.qa-tile span{font-size:9.5px;color:var(--muted);font-weight:600}

.badge{display:inline-flex;align-items:center;gap:4px;font-size:10.5px;font-weight:800;padding:4px 9px;border-radius:99px}
.badge.processing,.badge.pending{background:var(--marigold-light);color:var(--marigold-dark)}
.badge.paid,.badge.delivered,.badge.live,.badge.approved,.badge.completed,.badge.active{background:var(--emerald-light);color:var(--emerald)}
.badge.shipped,.badge.new,.badge.requested{background:var(--indigo-light);color:var(--indigo)}
.badge.cancelled,.badge.rejected,.badge.outofstock,.badge.failed{background:var(--coral-light);color:var(--coral)}
.badge.lowstock{background:var(--marigold-light);color:var(--marigold-dark)}
.badge.pickedup{background:var(--indigo-light);color:var(--indigo-dark)}

.row-card{display:flex;gap:11px;background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:12px;margin-bottom:8px;align-items:center}
.row-thumb{width:44px;height:44px;border-radius:11px;background:var(--indigo-light);color:var(--indigo);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.row-body{flex:1;min-width:0}
.row-top{display:flex;justify-content:space-between;gap:8px}
.row-id{font-weight:700;font-size:12.5px}
.row-time{font-size:10.5px;color:var(--muted-2);flex-shrink:0}
.row-mid{font-size:12px;color:var(--muted);margin-top:2px}
.row-bottom{display:flex;justify-content:space-between;align-items:center;margin-top:6px}
.row-price{font-weight:700;font-size:13px}

.detail-block{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:15px;margin-bottom:11px}
.detail-block h4{margin:0 0 11px;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.4px;font-weight:800}
.kv-row{display:flex;justify-content:space-between;padding:7px 0;font-size:12.5px;border-bottom:1px solid var(--border)}
.kv-row:last-child{border-bottom:none}
.kv-row span:first-child{color:var(--muted)}
.kv-row b{font-weight:700}
.kv-row.total b{color:var(--emerald);font-size:14px}

.timeline{list-style:none;margin:0;padding:0}
.timeline li{display:flex;gap:11px;padding-bottom:16px;position:relative}
.timeline li:last-child{padding-bottom:0}
.timeline li::before{content:'';position:absolute;left:9px;top:20px;bottom:0;width:2px;background:var(--border)}
.timeline li:last-child::before{display:none}
.t-dot{width:18px;height:18px;border-radius:50%;background:var(--border);color:#fff;display:flex;align-items:center;justify-content:center;flex-shrink:0;z-index:1}
.timeline li.done .t-dot{background:var(--emerald)}
.timeline li.current .t-dot{background:var(--indigo)}
.t-body b{display:block;font-size:12.5px}
.t-body span{font-size:10.5px;color:var(--muted-2)}

.btn{border:none;border-radius:12px;padding:13px 16px;font-weight:800;font-size:13px;width:100%;display:flex;align-items:center;justify-content:center;gap:7px}
.btn-primary{background:var(--indigo);color:#fff}
.btn-cta{background:var(--marigold);color:#241300}
.btn-danger{background:var(--coral);color:#fff}
.btn-outline{background:var(--card);color:var(--text);border:1px solid var(--border)}
.btn-success{background:var(--emerald);color:#fff}
.btn-row{display:flex;gap:9px}

.select-field,.text-field{width:100%;padding:11px 12px;border:1px solid var(--border);border-radius:11px;font-size:13px;background:var(--card);color:var(--text);margin-bottom:13px;outline:none}
.select-field:focus,.text-field:focus{border-color:var(--indigo)}
textarea.text-field{resize:vertical;min-height:74px}
.field-label{font-size:11.5px;font-weight:800;color:var(--muted);margin-bottom:6px;display:block}
.field-hint{font-size:10px;color:var(--muted-2);margin:-9px 0 12px}
.field-row{display:flex;gap:9px}
.field-row .field-col{flex:1}

.status-step{display:flex;gap:13px;align-items:flex-start;padding:13px 0;border-bottom:1px solid var(--border)}
.status-step:last-child{border-bottom:none}
.step-check{width:24px;height:24px;border-radius:50%;border:2px solid var(--border);display:flex;align-items:center;justify-content:center;flex-shrink:0;color:var(--muted-2);font-size:11px;font-weight:800}
.status-step.done .step-check{background:var(--emerald);border-color:var(--emerald);color:#fff}
.status-step b{display:block;font-size:12.5px}
.status-step span{font-size:11px;color:var(--muted)}
.status-step button{margin-top:8px;background:var(--indigo-light);color:var(--indigo-dark);padding:7px 13px;border-radius:8px;font-size:11px;font-weight:800}

.photo-row{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:13px}
.photo-thumb{width:60px;height:60px;border-radius:10px;background:var(--indigo-light);color:var(--indigo);display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden}
.photo-thumb img{width:100%;height:100%;object-fit:cover}
.photo-thumb .rm{position:absolute;top:2px;right:2px;width:17px;height:17px;background:rgba(0,0,0,.55);border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff}
.photo-add{width:60px;height:60px;border-radius:10px;border:2px dashed var(--border);display:flex;align-items:center;justify-content:center;color:var(--muted-2)}

.calc-box{background:var(--indigo-light);border:1px solid #D9DBFA;border-radius:12px;padding:13px;margin-bottom:15px}
.calc-title{font-size:11.5px;font-weight:800;color:var(--indigo-dark);margin-bottom:9px;display:flex;align-items:center;gap:6px}
.calc-row{display:flex;justify-content:space-between;font-size:12px;padding:3px 0}
.calc-row span:first-child{color:var(--muted)}
.calc-row.deduct span:last-child{color:var(--coral);font-weight:700}
.calc-row.final{border-top:1px solid #D9DBFA;margin-top:5px;padding-top:8px}
.calc-row.final span:first-child{font-weight:800;color:var(--text)}
.calc-row.final span:last-child{font-weight:900;color:var(--emerald);font-size:14px}

.platform-fee-box{background:var(--cloud);border-radius:10px;padding:11px 13px;margin-bottom:15px;display:flex;justify-content:space-between;align-items:center}
.platform-fee-box .lbl{font-size:12px;font-weight:800}
.platform-fee-box .val{font-size:12px;font-weight:800;color:var(--muted)}

.modal-overlay{position:fixed;inset:0;background:rgba(20,18,59,.5);display:none;align-items:flex-end;justify-content:center;z-index:200}
.modal-overlay.show{display:flex}
.modal-box{background:#fff;border-radius:20px 20px 0 0;padding:22px;max-width:480px;width:100%;box-shadow:0 -10px 40px rgba(0,0,0,.2)}
.modal-box.center{border-radius:18px;text-align:center;margin:auto;max-width:340px}
.modal-box .ic{width:50px;height:50px;border-radius:50%;background:var(--indigo-light);color:var(--indigo);display:flex;align-items:center;justify-content:center;margin:0 auto 10px}
.modal-box .ic.danger{background:var(--coral-light);color:var(--coral)}
.modal-box .ic.success{background:var(--emerald-light);color:var(--emerald)}
.modal-box h3{margin:0 0 7px;font-size:15px;font-family:var(--font-d)}
.modal-box p{margin:0 0 16px;font-size:12px;color:var(--muted)}

.toast{position:fixed;bottom:calc(20px + var(--bottomnav-h));left:50%;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;padding:12px 18px;border-radius:12px;font-size:12.5px;display:flex;align-items:center;gap:9px;opacity:0;pointer-events:none;transition:.25s;z-index:300;max-width:92vw}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.toast .ic{color:var(--emerald);flex-shrink:0}

.list-toolbar{display:flex;gap:9px;margin-bottom:11px}
.search-box{flex:1;display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--border);border-radius:11px;padding:10px 12px}
.search-box input{border:none;outline:none;flex:1;font-size:12.5px;background:transparent;color:var(--text)}
.chip-btn{width:38px;height:38px;border-radius:11px;background:var(--card);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;color:var(--muted)}
.filter-tabs{display:flex;gap:7px;overflow-x:auto;margin-bottom:11px}
.ftab{flex-shrink:0;padding:7px 13px;border-radius:20px;font-size:11.5px;font-weight:700;background:var(--card);border:1px solid var(--border);color:var(--muted);white-space:nowrap}
.ftab.active{background:var(--indigo);border-color:var(--indigo);color:#fff}

.action-banner{display:flex;align-items:center;justify-content:space-between;gap:9px;background:var(--marigold-light);border:1px solid #F5DFB0;border-radius:12px;padding:12px 14px;margin-bottom:13px;font-size:12px;color:#7A4E0B}
.action-banner b{display:block;font-size:12.5px;color:#5E3B00}
.action-banner button{background:var(--marigold);color:#241300;padding:8px 13px;border-radius:8px;font-size:11.5px;font-weight:800;white-space:nowrap}

.profile-head{display:flex;flex-direction:column;align-items:center;text-align:center;padding:6px 0 15px}
.store-avatar{width:66px;height:66px;border-radius:20px;background:var(--indigo-light);color:var(--indigo-dark);display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:700;margin-bottom:9px;font-family:var(--font-d)}
.profile-head h3{margin:2px 0;font-size:15px;font-family:var(--font-d)}
.verified-tag{font-size:11px;color:var(--emerald);font-weight:700;display:flex;align-items:center;gap:4px}
.profile-stats{display:flex;justify-content:center;gap:22px;margin-top:11px}
.profile-stats div{text-align:center}
.profile-stats b{display:block;font-size:14px;font-family:var(--font-d)}
.profile-stats span{font-size:10.5px;color:var(--muted)}

.menu-list{list-style:none;margin:0;padding:0}
.menu-list li{display:flex;align-items:center;gap:11px;padding:12px 3px;border-bottom:1px solid var(--border)}
.menu-list li:last-child{border-bottom:none}
.menu-ic{width:36px;height:36px;border-radius:11px;background:var(--indigo-light);color:var(--indigo);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.menu-list li b{display:block;font-size:12.5px}
.menu-list li span{font-size:10.5px;color:var(--muted)}
.chevron{margin-left:auto;color:var(--muted-2);flex-shrink:0}

.avail-payout{background:linear-gradient(135deg,var(--emerald),#0C8A5D);border-radius:16px;padding:17px;color:#fff;margin-bottom:13px}
.avail-payout span{font-size:11px;opacity:.85}
.avail-payout .amt{font-family:var(--font-d);font-size:24px;font-weight:700;margin:4px 0 10px}
.avail-payout button{margin-top:10px;background:#fff;color:var(--emerald);padding:10px 14px;border-radius:9px;font-weight:800;font-size:12px;width:100%}

.doc-row{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--border);font-size:12.5px}
.doc-row:last-child{border-bottom:none}
.doc-row .ok{display:flex;align-items:center;gap:5px;color:var(--emerald);font-weight:700}

.product-tile{display:flex;gap:11px;background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:11px;margin-bottom:8px;align-items:center}
.p-thumb{width:46px;height:46px;border-radius:11px;background:var(--indigo-light);color:var(--indigo);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.p-body{flex:1;min-width:0}
.p-body b{font-size:12.5px;display:block}
.p-body .sku{font-size:10px;color:var(--muted-2)}
.p-meta{display:flex;justify-content:space-between;align-items:center;margin-top:5px}
.dots-btn{color:var(--muted);padding:4px 6px}

.toggle{width:40px;height:23px;border-radius:20px;background:var(--border);position:relative;flex-shrink:0}
.toggle.on{background:var(--indigo)}
.toggle::after{content:'';position:absolute;top:2px;left:2px;width:19px;height:19px;border-radius:50%;background:#fff;transition:.15s}
.toggle.on::after{left:19px}

.overview-list{list-style:none;margin:0;padding:0}
.overview-list li{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--border);font-size:12.5px}
.overview-list li:last-child{border-bottom:none}
.overview-list li .lbl-row{display:flex;align-items:center;gap:8px}
.overview-list li .lbl-row svg{color:var(--muted)}
.overview-list li b{background:var(--indigo-light);color:var(--indigo-dark);padding:2px 10px;border-radius:20px;font-size:11px}

.stock-alert-card{display:flex;flex-direction:column;align-items:center;text-align:center;padding:26px 16px}
.stock-alert-card .ic{width:58px;height:58px;border-radius:50%;background:var(--indigo-light);color:var(--indigo);display:flex;align-items:center;justify-content:center;margin-bottom:13px}
.stock-alert-card.warn .ic{background:var(--marigold-light);color:var(--marigold-dark)}
.stock-alert-card h3{margin:0 0 6px;font-size:14px;font-family:var(--font-d)}
.stock-alert-card p{margin:0 0 15px;font-size:12px;color:var(--muted)}

.empty-state{display:flex;flex-direction:column;align-items:center;text-align:center;padding:50px 20px}
.empty-state .ic{width:58px;height:58px;border-radius:50%;background:var(--indigo-light);color:var(--indigo);display:flex;align-items:center;justify-content:center;margin-bottom:13px}

<script type="module">
/* =====================================================================
   SECURITY NOTE
   This file shares the SAME Firebase project as the buyer app, so a
   seller's signed-in session (Firebase Auth) carries over automatically
   when both files live on the same domain — no tokens are ever put in
   the URL. On load we require:
     1) an active Firebase Auth session, AND
     2) users/{uid}.seller_verification.status === 'approved'
   If either check fails, the dashboard never renders — the person sees
   only the access gate. All data reads below are additionally scoped
   to request.auth.uid by the existing Firestore rules (see
   /users/{uid} → allow read: if isOwner(uid) || isManager()), so even a
   modified client can never read another seller's earnings, payouts,
   or documents.
===================================================================== */
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, doc, getDoc, onSnapshot, collection, query, where } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyB9wwF-K1AwN8xlrppiKELDXx0NxqJknbc",
  authDomain: "apykart-916.firebaseapp.com",
  projectId: "apykart-916",
  storageBucket: "apykart-916.firebasestorage.app",
  messagingSenderId: "787741109597",
  appId: "1:787741109597:web:883a5eee5e9bb9602f8cb4"
};
const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);
window._db = db; window._auth = auth; window._signOut = () => signOut(auth);
window._fsHelpers = { db, doc, getDoc, onSnapshot, collection, query, where };

onAuthStateChanged(auth, async (user) => {
  const gate = document.getElementById('gate');
  if (!user) {
    document.getElementById('gateTitle').textContent = 'Sign in required';
    document.getElementById('gateSub').textContent = 'Please sign in to Apykart first, then reopen your Seller Dashboard from your Profile.';
    document.getElementById('gateBtn').style.display = 'block';
    document.querySelector('#gate .spin').style.display = 'none';
    return;
  }
  try {
    const snap = await getDoc(doc(db, 'users', user.uid));
    const d = snap.exists() ? snap.data() : {};
    const status = d.seller_verification?.status || '';
    if (status !== 'approved') {
      document.getElementById('gateTitle').textContent = status === 'pending' ? 'Verification pending' : 'Not a verified seller yet';
      document.getElementById('gateSub').textContent = status === 'pending'
        ? 'Your seller application is still under review. You will get access the moment it is approved.'
        : 'Apply to become a seller from your Apykart Profile to unlock this dashboard.';
      document.getElementById('gateBtn').style.display = 'block';
      document.querySelector('#gate .spin').style.display = 'none';
      return;
    }
    window.SELLER_UID = user.uid;
    window.SELLER_NAME = d.seller_verification?.brandName || d.profile?.name || user.displayName || 'Seller';
    window.SELLER_PHOTO = user.photoURL || '';
    gate.style.display = 'none';
    document.getElementById('app').style.display = 'flex';
    window.dispatchEvent(new Event('seller-ready'));
  } catch (e) {
    document.getElementById('gateTitle').textContent = 'Could not verify your account';
    document.getElementById('gateSub').textContent = 'Check your connection and try again.';
    document.getElementById('gateBtn').style.display = 'block';
    document.querySelector('#gate .spin').style.display = 'none';
  }
});
</script>

    navStack.push({...state});

  renderNav(); render(); renderCrumbs();

function toggleSizeOptions(){const cat=document.getElementById('prodCategory')?.value;const wrap=document.getElementById('sizeGroupWrap');const row=document.getElementById('sizeOptionsRow');if(!wrap||!row)return;const sizes=SIZE_SETS[cat];if(!sizes){wrap.style.display='none';row.innerHTML='';return;}wrap.style.display='block';row.innerHTML=sizes.map(s=>`<label style="display:flex;align-items:center;gap:6px;background:var(--cloud);border:1.5px solid var(--border);border-radius:9px;padding:7px 12px;font-size:12px;font-weight:700"><input type="checkbox" value="${s}" class="prodSizeChk">${s}</label>`).join('');}
function autoGenerateSKU(){const name=(document.getElementById('prodName')?.value||'PROD').trim();const cat=(document.getElementById('prodCategory')?.value||'GEN').toUpperCase();const namePart=name.replace(/[^a-zA-Z0-9]/g,'').slice(0,6).toUpperCase()||'ITEM';const rand=Math.floor(1000+Math.random()*9000);const skuInput=document.getElementById('prodSKU');if(skuInput)skuInput.value=`${cat.slice(0,4)}-${namePart}-${rand}`;}
window._prodImgs=[];
function previewImages(e){const files=Array.from(e.target.files).slice(0,5);window._prodImgs=[];const wrap=document.getElementById('imagePreview');wrap.innerHTML='';files.forEach((file,idx)=>{if(!file.type.startsWith('image/'))return;const reader=new FileReader();reader.onload=ev=>{window._prodImgs[idx]=ev.target.result;renderImagePreviews();};reader.readAsDataURL(file);});document.getElementById('imgCountLabel').textContent=files.length+'/5';}
function renderImagePreviews(){const wrap=document.getElementById('imagePreview');wrap.innerHTML=window._prodImgs.filter(Boolean).map((src,i)=>`<div class="photo-thumb"><img src="${src}"><div class="rm" onclick="removeProdImg(${i})">${icon('x',10)}</div></div>`).join('')+`<button type="button" class="photo-add" onclick="document.getElementById('prodImages').click()">${icon('plus',18)}</button>`;}
function removeProdImg(i){window._prodImgs[i]=null;renderImagePreviews();}
function updateProductCalc(){const price=parseFloat(document.getElementById('prodPrice')?.value)||0;const commissionPct=parseFloat(document.getElementById('prodAffiliateCommission')?.value)||0;const coins=parseFloat(document.getElementById('prodCoinReward')?.value)||0;const box=document.getElementById('calcBox');if(!box)return;if(price<=0){box.innerHTML=`<div class="calc-title">${icon('barchart',13)} Earnings breakdown</div><div style="font-size:11.5px;color:var(--muted)">Enter a selling price to see the calculation</div>`;return;}const platformFee=price*0.10;const affiliateAmt=price*(commissionPct/100);const coinValue=coins*COIN_TO_RUPEE;const sellerReceives=Math.max(0,price-platformFee-affiliateAmt-coinValue);box.innerHTML=`<div class="calc-title">${icon('barchart',13)} Earnings breakdown</div><div class="calc-row"><span>Selling price</span><span style="font-weight:700">₹${price.toFixed(0)}</span></div><div class="calc-row deduct"><span>Platform fee (10%)</span><span>−₹${platformFee.toFixed(0)}</span></div><div class="calc-row deduct"><span>Affiliate commission (${commissionPct}%)</span><span>−₹${affiliateAmt.toFixed(0)}</span></div><div class="calc-row deduct"><span>Buyer reward (${coins} coins)</span><span>−₹${coinValue.toFixed(0)}</span></div><div class="calc-row final"><span>You receive</span><span>₹${sellerReceives.toFixed(0)}</span></div>`;}
function submitProduct(editId){
  const name=(document.getElementById('prodName')?.value||'').trim();
  const mrp=parseFloat(document.getElementById('prodMRP')?.value||0);
  const price=parseFloat(document.getElementById('prodPrice')?.value||0);
  if(!name){toast('Enter a product name');return;}
  if(!mrp||mrp<=0){toast('Enter a valid MRP');return;}
  if(!price||price<=0){toast('Enter a valid selling price');return;}
  if(price>mrp){toast('Selling price cannot exceed MRP');return;}
  const discount=Math.round(((mrp-price)/mrp)*100);
  const stock=parseInt(document.getElementById('prodStock')?.value)||0;
  if(editId){
    const p=findProduct(editId);
    Object.assign(p,{name,mrp,price,discount,stock,status:stock<=0?'Out of Stock':(stock<10?'Low Stock':p.status)});
    toast('Product updated'); nav('home','detail',editId);
  } else {
    const id='sp_'+Date.now();
    products.unshift({id,sku:'',name,category:document.getElementById('prodCategory')?.value||'mobiles',price,mrp,discount,stock,status:'Pending',ic:'box'});
    toast('Product submitted for approval'); nav('home','list');
  }
  window._prodImgs=[];
}

function openModal(type,ctxId){
  const overlay=document.getElementById('modalOverlay');const box=document.getElementById('modalBox');let html='';box.className='modal-box';
  if(type==='logout'){box.className='modal-box center';html=`<div class="ic danger">${icon('logout',22)}</div><h3>Log out of Apykart?</h3><p>You can log back in anytime.</p><div class="btn-row"><button class="btn btn-outline" onclick="closeModal()">Cancel</button><button class="btn btn-danger" onclick="closeModal();window._signOut&&window._signOut();toast('Logged out')">Log out</button></div>`;}
  if(type==='cancelOrder'){const o=findOrder(ctxId);box.className='modal-box center';html=`<div class="ic danger">${icon('alertTriangle',22)}</div><h3>Cancel order #${o.id}?</h3><p>This action cannot be undone.</p><div class="btn-row"><button class="btn btn-outline" onclick="closeModal()">Keep order</button><button class="btn btn-danger" onclick="o.status='Cancelled';closeModal();toast('Order cancelled');nav('orders','home',null,{replace:true})">Confirm</button></div>`;}
  if(type==='approveReturn'){box.className='modal-box center';html=`<div class="ic success">${icon('checkCircle',22)}</div><h3>Approve this return?</h3><p>The customer will be notified and pickup will be scheduled.</p><div class="btn-row"><button class="btn btn-outline" onclick="closeModal()">Cancel</button><button class="btn btn-success" onclick="closeModal();toast('Return approved');nav('returns','pickup','${ctxId}')">Approve</button></div>`;}
  if(type==='rejectReturn'){box.className='modal-box center';html=`<div class="ic danger">${icon('xCircle',22)}</div><h3>Reject this return?</h3><p>The customer will be notified.</p><div class="btn-row"><button class="btn btn-outline" onclick="closeModal()">Cancel</button><button class="btn btn-danger" onclick="closeModal();toast('Return rejected');nav('returns','home',null,{replace:true})">Reject</button></div>`;}
  if(type==='deleteProduct'){box.className='modal-box center';html=`<div class="ic danger">${icon('trash',22)}</div><h3>Delete this product?</h3><p>This action cannot be undone.</p><div class="btn-row"><button class="btn btn-outline" onclick="closeModal()">Cancel</button><button class="btn btn-danger" onclick="products=products.filter(p=>p.id!=='${ctxId}');closeModal();toast('Product deleted');nav('home','list',null,{replace:true})">Delete</button></div>`;}
  if(type==='withdraw'){const available=sellerEarnings.filter(e=>e.status==='available').reduce((s,e)=>s+e.net_earning,0);html=`<div class="ic">${icon('wallet',22)}</div><h3>Request withdrawal</h3><p>Available: ₹${available.toFixed(0)}</p><input type="number" id="withdrawAmt" class="text-field" placeholder="Enter amount"><button class="btn btn-cta" onclick="submitWithdraw(${available})">Submit request</button>`;}
  box.innerHTML=html;overlay.classList.add('show');
}
function closeModal(){document.getElementById('modalOverlay').classList.remove('show');}

function submitWithdraw(available){const amt=parseFloat(document.getElementById('withdrawAmt').value);if(!amt||amt<=0||amt>available){toast('Enter a valid amount');return;}withdrawalRequests.push({id:'wd_'+Date.now(),amount:amt,status:'pending'});closeModal();toast('Withdrawal request submitted');nav('home','withdraw',null,{replace:true});}

function toast(msg){const t=document.getElementById('toast');document.getElementById('toastIcon').innerHTML=icon('checkCircle',16);document.getElementById('toastMsg').textContent=msg;t.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.remove('show'),2400);}
